<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Certificate of Achievement</title>

    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f4f1ea;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .certificate {
            width: 100%;
            max-width: 1050px;
            min-height: 680px;
            background: #ffffff;
            border: 10px solid #7C4616;
            padding: 55px 65px;
            position: relative;
        }

        .certificate:before {
            content: "";
            position: absolute;
            top: 14px;
            left: 14px;
            right: 14px;
            bottom: 14px;
            border: 2px solid #d9c7a3;
            pointer-events: none;
        }

        .header {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .institution-name {
            font-size: 24px;
            font-weight: bold;
            color: #7C4616;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .title {
            margin-top: 15px;
            font-size: 38px;
            font-weight: bold;
            color: #292929;
        }

        .certificate-type {
            margin-top: 8px;
            font-size: 14px;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .content {
            text-align: center;
            margin-top: 45px;
            position: relative;
            z-index: 1;
        }

        .intro {
            font-size: 17px;
            color: #444444;
        }

        .student-name {
            margin: 15px auto;
            padding: 8px 20px;
            max-width: 700px;
            border-bottom: 1px solid #d9c7a3;
            font-size: 34px;
            font-weight: bold;
            color: #292929;
        }

        .completion-text {
            margin-top: 12px;
            font-size: 17px;
            color: #444444;
        }

        .program {
            margin-top: 12px;
            font-size: 22px;
            font-weight: bold;
            color: #7C4616;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 45px;
            position: relative;
            z-index: 1;
        }

        .detail {
            width: 23%;
            text-align: center;
        }

        .detail-label {
            font-size: 11px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 7px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: bold;
            color: #292929;
            word-wrap: break-word;
        }

        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 55px;
            padding-top: 22px;
            border-top: 1px solid #eeeeee;
            position: relative;
            z-index: 1;
        }

        .verification {
            text-align: center;
            color: #999999;
            font-size: 11px;
        }

        .qr {
            margin-left: 80px;
            width: 120px;
            text-align: center;
        }

        .qr-image {
            width: 85px;
            height: 85px;
            object-fit: contain;
        }

        .qr-label {
            margin-top: 5px;
            font-size: 10px;
            color: #999999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div class="certificate">

    <!-- Institution -->
    <div class="header">

        <div class="institution-name">
            $institutionName
        </div>

        <div class="title">
            Certificate of Achievement
        </div>

        <div class="certificate-type">
            $certificateType
        </div>

    </div>


    <!-- Student -->
    <div class="content">

        <div class="intro">
            This is to certify that
        </div>

        <div class="student-name">
            $studentName
        </div>

        <div class="completion-text">
            has successfully completed the program
        </div>

        <div class="program">
            $program
        </div>

    </div>


    <!-- Details -->
    <div class="details">

        <div class="detail">

            <div class="detail-label">
                Student ID
            </div>

            <div class="detail-value">
                $studentId
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Batch
            </div>

            <div class="detail-value">
                $batchYear
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Grade
            </div>

            <div class="detail-value">
                $grade
            </div>

        </div>


        <div class="detail">

            <div class="detail-label">
                Issued On
            </div>

            <div class="detail-value">
                $issueDate
            </div>

        </div>

    </div>


    <!-- Verification -->
    <div class="footer">

        <div class="verification">
            Digitally Verifiable Credential
        </div>

        <div class="qr">

            <img
                class="qr-image"
                src="$qrCodeUrl"
                alt="Verification QR Code"
            >

            <div class="qr-label">
                Scan to Verify
            </div>

        </div>

    </div>

</div>

</body>
</html>
