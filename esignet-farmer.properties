mosip.esignet.vciplugin.sunbird-rc.credential-type.FarmerCredential.template-url=${spring_config_url_env}/${spring.application.name}/${active_profile_env}/${spring_config_label_env}/Farmer-credential.vm
mosip.esignet.vciplugin.sunbird-rc.credential-type.FarmerCredential.registry-get-url=http://10.3.1.146/registry/api/v1/Farmer/
