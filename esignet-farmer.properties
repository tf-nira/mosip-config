##---------------------------------Sunbird-RC Plugin Configurations------------------------------------------------------
## KBI fields: farmerId, name, dateOfBirth, region, district, village, phoneNumber
## Property names use "kbi" throughout - confirmed to be what the plugin code actually reads.
## individual-id-field is farmerId, so it is NOT repeated in the challenge fields below (handled separately by the code).

mosip.esignet.authenticator.sunbird-rc.auth-factor.kbi.field-details={{"id":"farmerId", "type":"text", "format":"", "maxLength": 50, "regex": "^[A-Za-z0-9\\-]*$"},{"id":"name", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z\\s.]*$"},{"id":"dateOfBirth", "type":"date", "format":"dd/MM/yyyy"},{"id":"region", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z\\s.,]*$"},{"id":"district", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z\\s.,]*$"},{"id":"village", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z\\s.,]*$"},{"id":"phoneNumber", "type":"text", "format":"", "maxLength": 15, "regex": "^[0-9]{10}$"}}
mosip.esignet.authenticator.sunbird-rc.auth-factor.kbi.individual-id-field=farmerId

## These "default" aliases feed the UI-facing ui.config.key-values block above
mosip.esignet.authenticator.default.auth-factor.kbi.field-details=${mosip.esignet.authenticator.sunbird-rc.auth-factor.kbi.field-details}
mosip.esignet.authenticator.default.auth-factor.kbi.individual-id-field=${mosip.esignet.authenticator.sunbird-rc.auth-factor.kbi.individual-id-field}

## Same Sunbird RC registry host/IP as your existing StudentCertificate/Institution setup
mosip.esignet.authenticator.sunbird-rc.auth-factor.kbi.registry-search-url=http://10.3.1.146/registry/api/v1/Farmer/search
mosip.esignet.authenticator.sunbird-rc.kbi.entity-id-field=osid
mosip.esignet.authenticator.sunbird-rc.registry-get-url=http://10.3.1.146/registry/api/v1/Farmer/

## Maps OIDC claim names to actual Farmer field names for the KYC/userinfo response
mosip.esignet.authenticator.sunbird-rc.identity-openid-claims-mapping={'name':'name','birthdate':'dateOfBirth','phone_number':'phoneNumber','address':'region'}

mosip.esignet.vciplugin.sunbird-rc.enable-psut-based-registry-search=false
mosip.esignet.vciplugin.sunbird-rc.credential-type.FarmerCredential.registry-search-url=http://10.3.1.146/registry/api/v1/Farmer/search
mosip.esignet.vciplugin.sunbird-rc.issue-credential-url=http://10.3.1.146/credentials-service/credentials/issue

##--------------------Supported Credential Type-------------------
mosip.esignet.vciplugin.sunbird-rc.supported-credential-types=FarmerCredential

