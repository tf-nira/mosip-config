## =====================================================================================================
## e-Signet properties for vcstore-esignet-plugin (bean: VcStoreAuthenticationService)
## Property names below are the exact ones the plugin reads (@Value in VcStoreAuthenticationService).
## Merge into your esignet-mock properties file in the config server.
## =====================================================================================================

## ---- 1. REPLACE these two existing lines ---------------------------------------------------------------
# Keep the existing scan packages: the other integration beans (key binder, binding validator, audit,
# captcha, VCI plugin) still come from the mock/IDA packages. Only the authenticator is swapped.
mosip.esignet.integration.scan-base-package=io.mosip.esignet.mock.integration,io.mosip.authentication.esignet.integration,org.openg2p.esignet.vcstore
mosip.esignet.integration.authenticator=VcStoreAuthenticationService

## ---- 2. ADD: plugin -> vc-store-service (required: eSignet will not start without the first two) -------
# Reach the service inside the cluster, never through the public gateway (/internal/** must stay private).
# The port is required: helm exposes the Service on 8080 (the app's own default is 8095, so check the pod).
mosip.esignet.vcstore.base-url=http://vc-store-service.<VC_STORE_NAMESPACE>.svc.cluster.local:8080/v1/vault
# Sent as X-Internal-Key. Must equal VAULT_INTERNAL_API_KEY on vc-store-service (16+ chars).
mosip.esignet.vcstore.internal-api-key=${vcstore.internal.api.key}

# Optional (these are the plugin's defaults):
mosip.esignet.vcstore.connect-timeout-ms=3000
mosip.esignet.vcstore.read-timeout-ms=10000
mosip.esignet.vcstore.otp-auth-factor=OTP
mosip.esignet.vcstore.supported-otp-channels=email,phone

## ---- 3. ADJUST existing values ---------------------------------------------------------------------------
# vc-store-service allows 1 OTP per 30 s; the existing value (10) would let users hit its throttle.
mosip.esignet.send-otp.invocation-gap-secs=30
# In mosip.esignet.ui.config.key-values change:
#   'resend.otp.delay.secs': 30            (currently ${mosip.kernel.otp.expiry-time}, a MOSIP IDA value)
#   'username.regex': '^[A-Za-z0-9 -]{12,20}$'   (currently ^[0-9]{10,30}$ , which rejects K7QM-2XPD-9TVR)
#   'username.max-length': 20              (currently 16; a claim code is 14 chars incl. dashes)
# If the OTP form still rejects the claim code after this, the restriction is in oidc-ui itself.

## ---- 4. ADD: credential scope so the access token's `aud` is the vault -----------------------------------
# <VCSTORE_SCOPE> must equal the scope Mimoto requests for this issuer. Append to the existing list:
mosip.esignet.supported.credential.scopes={'mock_identity_vc_ldp', 'sample_vc_mdoc', 'land_statement_vc_ldp', 'land_registry_vc_ldp', 'school_data_vc_ldp','agricultural_producer_vc_ldp','<VCSTORE_SCOPE>'}
# Append this entry to the existing mosip.esignet.credential.scope-resource-mapping map (value becomes `aud`):
#   , '<VCSTORE_SCOPE>' : 'https://${vcstore.public.host}/v1/vault/credential'
# and set VAULT_OIDC_ALLOWED_AUDIENCES on vc-store-service to that exact URL.

## ---- 5. Not in this file, but login will fail without them -----------------------------------------------
# a) amr-acr-mapping.json (loaded from mosip.esignet.amr-acr-mapping-file-url): 'mosip:idp:acr:generated-code' -> OTP
# b) Mimoto's eSignet client registration: authContextRefs must include mosip:idp:acr:generated-code,
#    and the wallet's authorization request must ask for that ACR.
# c) Load the jar: mount it at /home/mosip/plugins/ and set env plugin_name_env=vcstore-esignet-plugin.jar
#    on the esignet-mock deployment.
# d) vc-store-service env: VAULT_OIDC_ISSUER_URI = https://${mock.identity.esignet.host}/v1/esignet
#    (the token's `iss`, i.e. mosip.esignet.discovery.issuer-id; NOT the .well-known/openid-configuration URL),
#    VAULT_OIDC_JWK_SET_URI = ${mosip.esignet.jwks-uri}

## ---- 6. Config-server env overrides to add (values are never written in the file) -------------------------
# vcstore.internal.api.key
# vcstore.public.host
