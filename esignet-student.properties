## ------------------------------------------------- e-Signet ----------------------------------------------------------
## NOTE: This file mirrors certify-sunbird-insurance style config, adapted for the StudentCertificate use case.
## Replace 10.3.1.146 with your actual Sunbird RC registry host/IP wherever it appears below.

mosip.esignet.misp.license.key=${sunbirdrc.studentcert.esignet.misp.key}
mosip.esignet.amr-acr-mapping-file-url=${config.server.file.storage.uri}amr-acr-mapping.json
mosip.esignet.auth-txn-id-length=10
mosip.esignet.supported-id-regex=\\S*
mosip.esignet.id-token-expire-seconds=3600
mosip.esignet.access-token-expire-seconds=3600
mosip.esignet.link-code-expire-in-secs=60
mosip.esignet.generate-link-code.limit-per-transaction=10
mosip.esignet.authentication-expire-in-secs=120

mosip.esignet.auth-challenge.OTP.format=alpha-numeric
mosip.esignet.auth-challenge.OTP.min-length=6
mosip.esignet.auth-challenge.OTP.max-length=6

mosip.esignet.auth-challenge.KBA.format=base64url-encoded-json
mosip.esignet.auth-challenge.KBA.min-length=30
mosip.esignet.auth-challenge.KBA.max-length=150

mosip.esignet.header-filter.paths-to-validate={'${server.servlet.path}/authorization/send-otp', \
  '${server.servlet.path}/authorization/authenticate', \
  '${server.servlet.path}/authorization/v2/authenticate', \
  '${server.servlet.path}/authorization/v3/authenticate', \
  '${server.servlet.path}/authorization/auth-code'}

mosip.esignet.captcha.required=send-otp,pwd
mosip.esignet.send-otp.attempts=3
mosip.esignet.authenticate.attempts=3
mosip.kernel.otp.expiry-time=180

## ------------------------------------------ e-Signet binding ---------------------------------------------------------

mosip.esignet.binding.salt-length=16
mosip.esignet.binding.audience-id=esignet-binding
mosip.esignet.binding.key-expire-days=10
mosip.esignet.binding.encrypt-binding-id=false

## ------------------------------------------- Integrations ------------------------------------------------------------
## Same Sunbird RC plugin as insurance - only the entity/credential type config below changes.

mosip.esignet.integration.scan-base-package=io.mosip.esignet.mock.integration,io.mosip.esignet.sunbirdrc.integration.service
mosip.esignet.integration.binding-validator=BindingValidatorServiceImpl
mosip.esignet.integration.authenticator=SunbirdRCAuthenticationService
mosip.esignet.integration.key-binder=NoOpKeyBinder
mosip.esignet.integration.audit-plugin=LoggerAuditService
mosip.esignet.integration.captcha-validator=GoogleRecaptchaValidatorService
mosip.esignet.integration.vci-plugin=SunbirdRCVCIssuancePlugin

mosip.esignet.send-otp.captcha-required=false
mosip.esignet.captcha-validator.url=https://www.google.com/recaptcha/api/siteverify
mosip.esignet.captcha-validator.secret=${sunbirdrc.studentcert.esignet.captcha.secret.key}
mosip.esignet.captcha-validator.site-key=${sunbirdrc.studentcert.esignet.captcha.site.key}
mosip.esignet.captcha.validator-url=https://www.google.com/recaptcha/api/siteverify

## ------------------------------------------ oauth & openid supported values ------------------------------------------

mosip.esignet.supported.openid.scopes={'profile','email','phone'}
mosip.esignet.openid.scope.claims={'profile' : {'name','address','gender','birthdate','picture','email','phone_number','individual_id'},'email' : {'email'}, 'phone' : {'phone_number'}}

## New scope for the StudentCertificate VC
## MATCHER BLOCK: every time you register a new institution via the Certify credential-configurations API,
## add its scope string here (comma-separated) - this is the ONLY eSignet change needed per institution.
## Example after adding Springfield + Green Valley:
## mosip.esignet.supported.credential.scopes={'springfield_international_college_certificate_vc_ldp','green_valley_university_certificate_vc_ldp'}
mosip.esignet.supported.credential.scopes={'student_certificate_vc_ldp'}
mosip.esignet.credential.scope-resource-mapping={'student_certificate_vc_ldp': '${mosip.esignet.domain.url}${server.servlet.path}/vci/credential'}
## MATCHER BLOCK continued: every new scope maps to the SAME vci/credential endpoint, so this line just
## needs the new scope key added, always pointing to the same value:
## 'springfield_international_college_certificate_vc_ldp': '${mosip.esignet.domain.url}${server.servlet.path}/vci/credential'

mosip.esignet.supported.response.types={'code'}
mosip.esignet.supported.grant.types={'authorization_code'}
mosip.esignet.supported.ui.displays={'page','popup','touch','wap'}
mosip.esignet.supported.ui.prompts={'none','login','consent','select_account'}
mosip.esignet.supported.client.assertion.types={'urn:ietf:params:oauth:client-assertion-type:jwt-bearer'}
mosip.esignet.supported.client.auth.methods={'private_key_jwt'}
mosip.esignet.supported-pkce-methods={'S256'}

## ---------------------------------------- Cache configuration --------------------------------------------------------

mosip.esignet.cache.secure.individual-id=true
mosip.esignet.cache.store.individual-id=true
mosip.esignet.cache.security.secretkey.reference-id=TRANSACTION_CACHE
mosip.esignet.cache.security.algorithm-name=AES/ECB/PKCS5Padding
mosip.esignet.cache.names=clientdetails,preauth,authenticated,authcodegenerated,userinfo,linkcodegenerated,linked,linkedcode,linkedauth,consented,authtokens,bindingtransaction,vcissuance,apiRateLimit,blocked

spring.cache.type=redis
spring.cache.cache-names=${mosip.esignet.cache.names}
spring.redis.host=redis-master.esignet-sunbird.svc.cluster.local
spring.redis.port=6379
spring.redis.password=${sunbirdrc.studentcert.redis.password}
management.health.redis.enabled=false
mosip.esignet.cache.key.hash.algorithm=SHA3-256

## ------------------------------------------ Discovery openid-configuration -------------------------------------------

mosip.esignet.domain.url=https://${mosipid.esignet.studentcert.host}
mosip.esignet.discovery.issuer-id=${mosip.esignet.domain.url}${server.servlet.path}
mosip.esignet.jwks-uri=${mosip.esignet.domain.url}/.well-known/jwks.json
mosip.esignet.token.endpoint=${mosip.esignet.domain.url}${server.servlet.path}/oauth/v2/token

##----------------------------------------- Database properties --------------------------------------------------------

mosip.esignet.database.hostname=postgres-postgresql.postgres
mosip.esignet.database.port=5432
spring.datasource.url=jdbc:postgresql://${mosip.esignet.database.hostname}:${mosip.esignet.database.port}/mosip_esignet_studentcert?currentSchema=esignet
spring.datasource.username=esignetuser
spring.datasource.password=${db.dbuser.password}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none

## ------------------------------------------------ Kafka ---------------------------------------------------------------

kafka.enabled=true
kafka.profile=kafka.svc.cluster.local
kafka.port=9092
spring.kafka.bootstrap-servers=kafka-0.kafka-headless.${kafka.profile}:${kafka.port},kafka-1.kafka-headless.${kafka.profile}:${kafka.port},kafka-2.kafka-headless.${kafka.profile}:${kafka.port}
spring.kafka.consumer.group-id=esignet-studentcert-consumer
spring.kafka.consumer.enable-auto-commit=true

## -------------------------------------------- IDP-UI config ----------------------------------------------------------

mosip.esignet.ui.wallet.config={{'wallet.name': 'Inji Mobile App', 'wallet.logo-url': 'inji_logo.png', 'wallet.download-uri': '#', \
 'wallet.deep-link-uri': 'inji://landing-page-name?linkCode=LINK_CODE&linkExpireDateTime=LINK_EXPIRE_DT' }}

mosip.esignet.ui.config.key-values={'auth.txnid.length' : '${mosip.esignet.auth-txn-id-length}', \
  'consent.screen.timeout-in-secs':${mosip.esignet.authentication-expire-in-secs}, \
  'consent.screen.timeout-buffer-in-secs': 5, 'linked-transaction-expire-in-secs': 240, \
  'wallet.qr-code-buffer-in-secs': 10, 'otp.length': ${mosip.esignet.auth-challenge.OTP.max-length}, \
  'wallet.config': ${mosip.esignet.ui.wallet.config}, \
  'error.banner.close-timer': 10, \
  'auth.factor.kbi.individual-id-field' : '${mosip.esignet.authenticator.default.auth-factor.kba.individual-id-field}',\
  'auth.factor.kbi.field-details': ${mosip.esignet.authenticator.default.auth-factor.kba.field-details} }

##  ---------------------------------------------- VCI ------------------------------------------------------------------

mosip.esignet.vci.identifier=${mosip.esignet.domain.url}
mosip.esignet.vci.authn.filter-urls={ '${server.servlet.path}/vci/credential' }
mosip.esignet.vci.authn.issuer-uri=${mosip.esignet.discovery.issuer-id}
mosip.esignet.vci.authn.jwk-set-uri=${mosip.esignet.jwks-uri}
mosip.esignet.vci.authn.allowed-audiences={ '${mosip.esignet.domain.url}${server.servlet.path}/vci/credential' }

mosip.esignet.cnonce-expire-seconds=40
mosip.esignet.vci.supported.jwt-proof-alg={'RS256','PS256'}

mosip.esignet.vci.key-values={\
 'latest' : {\
    'credential_issuer': '${mosip.esignet.vci.identifier}',   \
    'credential_endpoint': '${mosip.esignet.domain.url}${server.servlet.path}/vci/credential', \
    'display': {{'name': 'Student Certificate', 'locale': 'en'}},\
    'credentials_supported' : { \
       "StudentCertificate" : {\
          'format': 'ldp_vc',\
          'scope' : 'student_certificate_vc_ldp',\
          'cryptographic_binding_methods_supported': {'did:jwk'},\
          'cryptographic_suites_supported': {'Ed25519Signature2020'},\
          'proof_types_supported': {'jwt'},\
          'credential_definition': {\
            'type': {'VerifiableCredential','StudentCertificate'},\
            'credentialSubject': {\
                  'studentName': {'display': {{'name': 'Student Name','locale': 'en'}}}, \
                  'studentId': {'display': {{'name': 'Student ID','locale': 'en'}}},\
                  'institutionName': {'display': {{'name': 'Institution Name','locale': 'en'}}},\
                  'program': {'display': {{'name': 'Program','locale': 'en'}}},\
                  'certificateType': {'display': {{'name': 'Certificate Type','locale': 'en'}}},\
                  'grade': {'display': {{'name': 'Grade','locale': 'en'}}},\
                  'issueDate': {'display': {{'name': 'Issue Date','locale': 'en'}}}\
           }},\
          'display': {{'name': 'Student Certificate', \
                        'locale': 'en', \
                        'logo': {'url': 'https://${mosip.api.public.host}/inji/student-certificate-logo.png', 'alt_text': 'a square logo representing student certificate'},\
                        'background_color': '#FDFAF9',\
                        'text_color': '#7C4616'}},\
          'order' : {'studentName','studentId','institutionName','program','certificateType','grade','issueDate'}\
       }\
    }\
 }\
}

## -------------------------------------------- Others ----------------------------------------------------------

logging.level.org.springframework.web.client.RestTemplate=DEBUG
logging.level.io.mosip.esignet=DEBUG

##---------------------------------Sunbird-RC Plugin Configurations------------------------------------------------------
## KBA (Knowledge Based Authentication) fields the student must enter to prove ownership.
## Per your request: studentId, certificateType, institutionName

mosip.esignet.authenticator.sunbird-rc.auth-factor.kba.field-details={{"id":"studentId", "type":"text", "format":"", "maxLength": 50, "regex": "^[A-Za-z0-9\\-]*$"},{"id":"studentName", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z\\s.]*$"},{"id":"dateOfBirth", "type":"date", "format":"dd/mm/yyyy"},{"id":"program", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z0-9\\s.,]*$"},{"id":"institutionName", "type":"text", "format":"", "maxLength": 100, "regex": "^[A-Za-z\\s.,0-9]*$"}}
mosip.esignet.authenticator.sunbird-rc.auth-factor.kba.individual-id-field=studentId
mosip.esignet.authenticator.default.auth-factor.kba.field-details=${mosip.esignet.authenticator.sunbird-rc.auth-factor.kba.field-details}
mosip.esignet.authenticator.default.auth-factor.kba.individual-id-field=${mosip.esignet.authenticator.sunbird-rc.auth-factor.kba.individual-id-field}

## Replace 10.3.1.146 with your Sunbird RC registry host
mosip.esignet.authenticator.sunbird-rc.auth-factor.kba.registry-search-url=http://10.3.1.146/api/v1/StudentCertificate/search
mosip.esignet.authenticator.sunbird-rc.kba.entity-id-field=osid

mosip.esignet.vciplugin.sunbird-rc.enable-psut-based-registry-search=false
mosip.esignet.vciplugin.sunbird-rc.credential-type.StudentCertificate.registry-search-url=http://10.3.1.146/api/v1/StudentCertificate/search
mosip.esignet.vciplugin.sunbird-rc.issue-credential-url=http://10.3.1.146/credentials-service/credentials/issue

##--------------------Supported Credential Type-------------------
mosip.esignet.vciplugin.sunbird-rc.supported-credential-types=StudentCertificate

##--------------------Student Certificate Credential Type-------------------
## NOTE: cred-schema-id below is a PLACEHOLDER. You must generate a real one by registering
## a Credential Schema for StudentCertificate via Sunbird RC's Schema service (separate from
## the entity schema you already created) - see note below the file.
mosip.esignet.vciplugin.sunbird-rc.credential-type.StudentCertificate.static-value-map.issuerId=did:web:api.released.mosip.net:identity-service:02b073b8-aacd-472e-b63f-265bb7ccdd9f
mosip.esignet.vciplugin.sunbird-rc.credential-type.StudentCertificate.template-url=${spring_config_url_env}/${spring.application.name}/${active_profile_env}/${spring_config_label_env}/student-certificate-credential.json
mosip.esignet.vciplugin.sunbird-rc.credential-type.StudentCertificate.registry-get-url=http://10.3.1.146/api/v1/StudentCertificate/
mosip.esignet.vciplugin.sunbird-rc.credential-type.StudentCertificate.cred-schema-id=did:schema:144cb8de-5219-43f3-a44a-70fff483b537
mosip.esignet.vciplugin.sunbird-rc.credential-type.StudentCertificate.cred-schema-version=1.0.0
